services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: advisory
      POSTGRES_PASSWORD: advisory
      POSTGRES_DB: advisory_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory -d advisory_test"]
      interval: 2s
      timeout: 3s
      retries: 20
