# 로컬 개발용. AWS 실제 배포 환경의 PostgreSQL 버전과 반드시 맞출 것
# (pgvector 확장이 포함된 이미지를 사용해야 함)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: advisory
      POSTGRES_PASSWORD: advisory
      POSTGRES_DB: advisory
    ports:
      - "5432:5432"
    volumes:
      - advisory_pgdata:/var/lib/postgresql/data
      # 스키마는 앱이 기동 시 직접 적용한다(migrations.apply_schema).
      # 여기 initdb 마운트는 psql로 seed를 넣기 전에 테이블이 있게 하는 편의용.
      - ./src/advisory_service/infrastructure/persistence/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory -d advisory"]
      interval: 2s
      timeout: 3s
      retries: 20

  advisory-service:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"

volumes:
  advisory_pgdata:
