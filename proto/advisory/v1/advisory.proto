// advisory-service가 다른 Candle 내부 서비스(BFF 등)에 노출하는 gRPC 계약.
//
// 초안 단계 — 필드/서비스명은 팀장 및 BFF 담당자와 협의 후 확정 필요.
// (Candle 컨벤션: 내부 서비스 간 통신은 gRPC, REST는 웹앱-BFF 구간만)

syntax = "proto3";

package candle.advisory.v1;

service AdvisoryService {
  // 사용자 투자성향 기반 종목 추천 조회
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
}

message GetRecommendationsRequest {
  // 사용자 ID는 신뢰 가능한 x-user-id gRPC metadata에서 읽는다.
  string risk_tolerance = 1;       // 'conservative' | 'moderate' | 'aggressive'
  string investment_horizon = 2;   // 'short' | 'mid' | 'long'
  repeated string preferred_sectors = 3;
  string free_text_query = 4;
}

message GetRecommendationsResponse {
  repeated Recommendation recommendations = 1;
  string validation_status = 2;    // 'passed' | 'retried' | 'failed'
  repeated string validation_errors = 3;
  int32 retry_count = 4;
}

message Recommendation {
  string stock_code = 1;
  string name_kr = 2;
  double fit_score = 3;
  string narrative = 4;
  repeated string improvement_tags = 5;
  int64 price_snapshot = 6;
}
